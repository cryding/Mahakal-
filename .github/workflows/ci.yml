name: MAHAKAL Android & Server CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Quality, Linting & Security Scan
  # ============================================================================
  quality-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify Secret Leak Prevention
        run: |
          echo "Scanning codebase for unauthorized hardcoded secrets..."
          # Fail if private keys or un-templated production passwords exist in code
          ! grep -rE "BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY" app/src/ || exit 1
          echo "No secret keys committed to source tree."

      - name: Run Secret Gradle Check
        run: |
          cp .env.example .env
          echo "Injected placeholder .env for clean build verification."

  # ============================================================================
  # Stage 2: Unit, Migration & Integration Testing
  # ============================================================================
  test:
    name: Unit & Architecture Tests
    needs: quality-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Local Environment
        run: cp .env.example .env

      - name: Run JVM Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  # ============================================================================
  # Stage 3: Validate Release Compilation
  # ============================================================================
  validate-release-build:
    name: Validate Release Compilation
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Local Environment
        run: cp .env.example .env

      - name: Validate Release Compilation & Lint
        run: |
          gradle :app:compileReleaseKotlin :app:lintVitalRelease --no-daemon
