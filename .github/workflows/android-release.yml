name: MAHAKAL Android Release & GitHub Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Git Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      publish_release:
        description: 'Publish GitHub Release asset'
        required: true
        type: boolean
        default: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_verify:
    name: Build & Verify Production Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enforce Production Secrets Validation
        env:
          KEYSTORE_BASE64: ${{ secrets.PROD_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PROD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PROD_KEY_PASSWORD }}
        run: |
          echo "Auditing production signing secrets..."
          MISSING=0
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing required secret: PROD_RELEASE_KEYSTORE_BASE64"
            MISSING=1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing required secret: PROD_STORE_PASSWORD"
            MISSING=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required secret: PROD_KEY_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "FATAL: Release workflow aborted. Missing required production signing secrets."
            exit 1
          fi
          echo "All required production signing secrets are present."

      - name: Prepare & Verify Temporary Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PROD_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PROD_STORE_PASSWORD }}
        run: |
          KEYSTORE_FILE="/tmp/release_$(date +%s).jks"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          
          # Verify format is PKCS12 and alias is upload
          KEYTOOL_OUT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD")
          
          if ! echo "$KEYTOOL_OUT" | grep -qi "PKCS12"; then
            echo "::error::Keystore is not in PKCS12 format"
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi
          
          if ! echo "$KEYTOOL_OUT" | grep -qi "Alias name: upload"; then
            echo "::error::Keystore does not contain required alias 'upload'"
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi
          
          # Verify SHA-256 fingerprint exactly matches canonical fingerprint
          CANONICAL_FINGERPRINT="52:E9:B3:41:EC:66:62:A4:60:5B:0A:DE:2F:E8:51:54:64:D6:12:A3:52:F4:CB:38:B3:F3:9C:AF:AD:97:BD:3A"
          ACTUAL_SHA256=$(echo "$KEYTOOL_OUT" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr 'a-z' 'A-Z')
          
          echo "Actual Keystore SHA256: $ACTUAL_SHA256"
          echo "Expected Keystore SHA256: $CANONICAL_FINGERPRINT"
          
          if [ "$ACTUAL_SHA256" != "$CANONICAL_FINGERPRINT" ]; then
            echo "::error::Keystore certificate SHA-256 does not match canonical production fingerprint!"
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi
          echo "Keystore verification passed: PKCS12, alias=upload, canonical fingerprint verified."

      - name: Verify Build Configuration & Production Endpoints
        run: |
          echo "Auditing application identity and build configuration..."
          python3 -c "
          with open('app/build.gradle.kts', 'r') as f:
              gradle_content = f.read()
          import re
          app_id = re.search(r'applicationId\s*=\s*\"([^\"]+)\"', gradle_content)
          ver_name = re.search(r'versionName\s*=\s*\"([^\"]+)\"', gradle_content)
          ver_code = re.search(r'versionCode\s*=\s*([0-9]+)', gradle_content)
          
          assert app_id and app_id.group(1) == 'com.aistudio.mahakal.ledger', f'Application ID mismatch: {app_id.group(1) if app_id else None}'
          assert ver_name and ver_name.group(1) == '1.0', f'Version Name mismatch: {ver_name.group(1) if ver_name else None}'
          assert ver_code and ver_code.group(1) == '1', f'Version Code mismatch: {ver_code.group(1) if ver_code else None}'
          
          # Verify production API URL in release buildType
          assert 'https://mahakal-qo14.onrender.com' in gradle_content, 'Production API URL not configured in build.gradle.kts'
          assert 'production' in gradle_content, 'Production environment not configured in build.gradle.kts'
          print('Application identity and build configuration verified successfully.')
          "

      - name: Run Source Security Checks & Tests
        run: |
          echo "Scanning for accidental committed private keys or credentials..."
          ! grep -rE "BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY" app/src/ || exit 1
          gradle :app:testDebugUnitTest --no-daemon

      - name: Build Android Production Release APK & AAB
        env:
          ORG_GRADLE_PROJECT_mahakal_release_keystore: ${{ env.KEYSTORE_PATH }}
          ORG_GRADLE_PROJECT_mahakal_release_storePassword: ${{ secrets.PROD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_mahakal_release_keyAlias: upload
          ORG_GRADLE_PROJECT_mahakal_release_keyPassword: ${{ secrets.PROD_KEY_PASSWORD }}
          MAHAKAL_RELEASE_KEYSTORE: ${{ env.KEYSTORE_PATH }}
          MAHAKAL_RELEASE_STORE_PASSWORD: ${{ secrets.PROD_STORE_PASSWORD }}
          MAHAKAL_RELEASE_KEY_ALIAS: upload
          MAHAKAL_RELEASE_KEY_PASSWORD: ${{ secrets.PROD_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Stage Artifacts
        run: |
          mkdir -p release-artifacts
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" ! -name "*unsigned*" | head -n 1)
          
          if [ -z "$APK_SRC" ]; then
            echo "::error::Signed Release APK was not generated"
            exit 1
          fi
          if [ -z "$AAB_SRC" ]; then
            echo "::error::Signed Release AAB was not generated"
            exit 1
          fi
          
          cp "$APK_SRC" release-artifacts/MAHAKAL-release.apk
          cp "$AAB_SRC" release-artifacts/MAHAKAL-release.aab

      - name: Verify APK Signature with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          
          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs release-artifacts/MAHAKAL-release.apk)
          echo "$VERIFY_OUTPUT"
          
          # Check for debug certificate - must FAIL if debug
          if echo "$VERIFY_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "::error::APK was signed with Debug certificate! Hard failure."
            exit 1
          fi
          
          # Fail if APK is unsigned
          if ! echo "$VERIFY_OUTPUT" | grep -qi "Verifies"; then
            echo "::error::APK verification failed - APK is unsigned or invalid!"
            exit 1
          fi
          
          # Verify SHA-256 certificate fingerprint matches canonical fingerprint
          CANONICAL_FINGERPRINT="52:E9:B3:41:EC:66:62:A4:60:5B:0A:DE:2F:E8:51:54:64:D6:12:A3:52:F4:CB:38:B3:F3:9C:AF:AD:97:BD:3A"
          APK_SHA256=$(echo "$VERIFY_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          
          CLEAN_CANONICAL=$(echo "$CANONICAL_FINGERPRINT" | tr -d ': ' | tr 'A-Z' 'a-z')
          CLEAN_ACTUAL=$(echo "$APK_SHA256" | tr -d ': ' | tr 'A-Z' 'a-z')
          
          echo "APK Certificate SHA-256: $CLEAN_ACTUAL"
          echo "Canonical SHA-256:       $CLEAN_CANONICAL"
          
          if [ -z "$CLEAN_ACTUAL" ] || [ "$CLEAN_ACTUAL" != "$CLEAN_CANONICAL" ]; then
            echo "::error::APK signature certificate does not match the canonical production fingerprint!"
            exit 1
          fi
          echo "APK signature successfully verified with canonical production certificate."

      - name: Verify AAB Signature
        run: |
          echo "Verifying AAB signing information..."
          AAB_FILE="release-artifacts/MAHAKAL-release.aab"
          
          JARSIGNER_OUT=$(jarsigner -verify -verbose -certs "$AAB_FILE" 2>&1)
          if ! echo "$JARSIGNER_OUT" | grep -qi "jar verified"; then
            echo "::error::AAB signature verification failed - AAB is unsigned or invalid!"
            exit 1
          fi
          
          CERT_DUMP=$(keytool -printcert -jarfile "$AAB_FILE")
          echo "$CERT_DUMP"
          
          if echo "$CERT_DUMP" | grep -qi "CN=Android Debug"; then
            echo "::error::AAB was signed with Debug certificate!"
            exit 1
          fi
          
          CANONICAL_FINGERPRINT="52:E9:B3:41:EC:66:62:A4:60:5B:0A:DE:2F:E8:51:54:64:D6:12:A3:52:F4:CB:38:B3:F3:9C:AF:AD:97:BD:3A"
          CLEAN_CANONICAL=$(echo "$CANONICAL_FINGERPRINT" | tr -d ': ' | tr 'a-z' 'A-Z')
          AAB_SHA256=$(echo "$CERT_DUMP" | grep -i "SHA256:" | head -n 1 | awk '{print $NF}' | tr -d ': ' | tr 'a-z' 'A-Z')
          
          echo "AAB Certificate SHA-256: $AAB_SHA256"
          echo "Canonical SHA-256:       $CLEAN_CANONICAL"
          
          if [ -z "$AAB_SHA256" ] || [ "$AAB_SHA256" != "$CLEAN_CANONICAL" ]; then
            echo "::error::AAB signature does not match canonical production fingerprint!"
            exit 1
          fi
          echo "AAB signature verified with canonical production certificate."

      - name: Run Artifact Secret & Endpoint Scan
        run: |
          echo "Scanning APK and AAB for leaked secrets and disallowed endpoints..."
          
          APK_LIST=$(unzip -l release-artifacts/MAHAKAL-release.apk)
          AAB_LIST=$(unzip -l release-artifacts/MAHAKAL-release.aab)
          
          for PATTERN in ".jks" ".keystore" ".signing.properties" "secrets_transfer" "password"; do
            if echo "$APK_LIST" | grep -qi "$PATTERN"; then
              echo "::error::Prohibited secret artifact found in APK: $PATTERN"
              exit 1
            fi
            if echo "$AAB_LIST" | grep -qi "$PATTERN"; then
              echo "::error::Prohibited secret artifact found in AAB: $PATTERN"
              exit 1
            fi
          done
          
          unzip -q -o release-artifacts/MAHAKAL-release.apk -d /tmp/apk_unpacked
          for ENDPOINT in "127.0.0.1" "10.0.2.2" "10.0.3.2" "localhost" "dev-api.mahakal.internal"; do
            if grep -rq "$ENDPOINT" /tmp/apk_unpacked/classes*.dex; then
              echo "::error::Prohibited development endpoint found in release DEX: $ENDPOINT"
              rm -rf /tmp/apk_unpacked
              exit 1
            fi
          done
          rm -rf /tmp/apk_unpacked
          echo "Artifact secret and endpoint scans passed."

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum MAHAKAL-release.apk MAHAKAL-release.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Verified Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mahakal-production-release
          path: release-artifacts/*
          retention-days: 30

      - name: Clean Temporary Production Keystore
        if: always()
        run: |
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            echo "Securely cleaning up temporary decoded keystore..."
            shred -u "$KEYSTORE_PATH" 2>/dev/null || rm -f "$KEYSTORE_PATH"
          fi
          echo "Temporary keystore cleanup completed."

  publish_release:
    name: Publish Production GitHub Release
    needs: build_and_verify
    if: ${{ (github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true') && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Verified Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mahakal-production-release
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "MAHAKAL ${{ github.event.inputs.release_tag || github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/MAHAKAL-release.apk
            release-artifacts/MAHAKAL-release.aab
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
