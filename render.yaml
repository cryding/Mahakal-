# Render Blueprint Specification for MAHAKAL Enterprise Cloud API
services:
  - type: web
    name: mahakal-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_SIGNING_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
